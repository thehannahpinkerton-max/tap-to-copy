<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Copy and open</title>
<style>
  body { margin: 0; padding: 20px 16px 40px; background: #fff; color: #1a1a1a;
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  #text { white-space: pre-wrap; background: #f4f4f4; border-radius: 8px; padding: 14px;
          -webkit-user-select: all; user-select: all; }
  #go { display: block; width: 100%; margin: 18px 0 12px; padding: 16px; border: 0; border-radius: 8px;
        background: #d93a00; color: #fff; font: 600 18px/1.2 inherit; font-family: inherit; }
  #msg a { color: #d93a00; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="ready" hidden>
    <p id="help">Tap the button to copy this comment and open the thread. Then paste it as a new comment and post.</p>
    <button id="go" type="button">Copy and open</button>
    <p id="msg"></p>
    <div id="text"></div>
  </div>
  <p id="bad" hidden>This link is missing its comment. Use the text in the email instead.</p>
</main>
<script>
// The comment and thread travel in the # part of the link, which browsers never send to the server.
(function () {
  function read() {
    try {
      var b = location.hash.slice(1).replace(/-/g, "+").replace(/_/g, "/");
      var bytes = Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); });
      var d = JSON.parse(new TextDecoder().decode(bytes));
      var u = new URL(d.u);
      if (u.protocol !== "https:" || u.hostname !== "www.reddit.com" || !d.t) return null;
      return { url: u.href, text: String(d.t) };
    } catch (e) { return null; }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  }
  function say(message, url) {
    var msg = document.getElementById("msg");
    msg.textContent = message + " ";
    var a = document.createElement("a");
    a.href = url;
    a.textContent = "Open the thread";
    msg.appendChild(a);
  }
  var d = read();
  if (!d) { document.getElementById("bad").hidden = false; return; }
  document.getElementById("text").textContent = d.text;
  document.getElementById("ready").hidden = false;
  document.getElementById("go").addEventListener("click", function () {
    var done = function () {
      say("Copied. If the thread did not open, use this link.", d.url);
      location.href = d.url;
    };
    var failed = function () {
      if (fallbackCopy(d.text)) return done();
      say("Your phone blocked the copy. Press and hold the text below to copy it, then open the thread.", d.url);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(d.text).then(done, failed);
    else failed();
  });
})();
</script>
</body>
</html>
